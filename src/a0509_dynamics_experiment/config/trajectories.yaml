# Research starting values only. No path below has been certified on a real A0509.
T1:
  name: Linear Reciprocation
  delta_mm: [120, 0, 0]
T2:
  name: Spatial Diagonal
  delta_mm: [0, 80, 60]
T3:
  name: 3D Box Trajectory
  delta_mm: [120, 80, 60]
T4:
  name: Joint Excitation
  amplitude_deg: 5
  default_mode: sequential
# T5-T15 definitions are implemented in trajectory_generator.EXCITATIONS.
# They are joint-space, 100 Hz, 1 s pre/post hold, C2 quintic envelopes.
# T16 uses the separately validated Fourier endpoint constraints below.
# Frequencies, phase, and per-joint amplitudes are saved in each trial metadata.
dynamics10:
  seed: 20261110
  train: [T5, T6, T7, T8, T9, T10, T11]
  validation: [T12]
  test: [T13, T14]
  legacy_diagnostic: [T4]
  trajectories:
    T5: {name: "J2/J3 alternating sine", duration_s: 12}
    T6: {name: "J1/J4 coupled sine", duration_s: 12}
    T7: {name: "J5/J6 wrist excitation", duration_s: 12}
    T8: {name: "J1/J3/J5 multi-sine", duration_s: 14}
    T9: {name: "J2/J4/J6 multi-sine", duration_s: 14}
    T10: {name: "six-joint multi-sine", duration_s: 16}
    T11: {name: "J2/J3/J5 frequency sweep", duration_s: 14}
    T12: {name: "J1/J4/J6 validation chirp", duration_s: 14}
    T13: {name: "shifted-posture multi-sine", duration_s: 14}
    T14: {name: "shifted-posture mixed excitation", duration_s: 15}

# T16 replaces only the former held-out chirp. Its exact validated coefficients,
# objective metrics and simulation-only limits are in t16_fourier_optimized.json.
# t16_legacy_chirp.json preserves the former definition for Figure 1.
T16:
  name: Optimized Fourier Excitation
  split: test
  model: A0509 with approximate fixed AG145
  harmonics: 3
  fundamental_hz: 0.1
  period_s: 10.0
  sample_hz: 100
  coefficient_file: t16_fourier_optimized.json
  objective_kind: parameter-sensitivity proxy
  real_motion_allowed: false
