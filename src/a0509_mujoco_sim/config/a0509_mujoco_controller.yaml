# mujoco_ros2_control creates controller manager node named "mujoco_controller_manager"
# so update_rate must be under this key for the node to find it
mujoco_controller_manager:
  ros__parameters:
    update_rate: 100
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    dsr_position_controller:
      type: forward_command_controller/ForwardCommandController

/**:
  controller_manager:
    ros__parameters:
      update_rate: 100
      joint_state_broadcaster:
        type: joint_state_broadcaster/JointStateBroadcaster
      dsr_position_controller:
        type: forward_command_controller/ForwardCommandController

  dsr_position_controller:
    ros__parameters:
      joints:
        - joint_1
        - joint_2
        - joint_3
        - joint_4
        - joint_5
        - joint_6
      interface_name: position
      command_interfaces:
        - position
      state_interfaces:
        - position
        - velocity
